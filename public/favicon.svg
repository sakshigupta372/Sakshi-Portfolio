<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#000000"/>
  
  <!-- Gradient Effect -->
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- SG Text -->
  <text x="50" y="70" font-family="monospace" font-size="48" font-weight="bold" fill="url(#textGradient)" text-anchor="middle">SG</text>
  
  <!-- Subtle border -->
  <rect width="100" height="100" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
</svg>
